name: SSHKeeper
options:
  bundleIdPrefix: com.sshkeeper
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "SSHKeeper"
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
    INFOPLIST_KEY_NSPrincipalClass: NSApplication
    INFOPLIST_KEY_NSMainStoryboardFile: ""
    # 用本机已装的 Developer ID 做稳定签名 — 每次 build 签名 hash 不变，
    # Keychain ACL 一直认这个 App，不会因为重建签名失效。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: BXBZ8N36ED
    # Manual signing 默认不带 secure timestamp，公证会拒；显式加上
    OTHER_CODE_SIGN_FLAGS: --timestamp
    # Universal binary：arm64 + x86_64，覆盖 Apple Silicon 和 Intel Mac
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  PostgresNIO:
    url: https://github.com/vapor/postgres-nio
    from: 1.21.0
  MySQLNIO:
    url: https://github.com/vapor/mysql-nio
    from: 1.7.0

targets:
  SSHKeeperCore:
    type: framework
    platform: macOS
    sources:
      - path: SSHKeeperCore
    dependencies:
      - package: PostgresNIO
      - package: MySQLNIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sshkeeper.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  SSHKeeper:
    type: application
    platform: macOS
    sources:
      - path: SSHKeeper
    dependencies:
      - target: SSHKeeperCore
        embed: true
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sshkeeper.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SSHKeeper/Resources/Info.plist
      configs:
        # Debug 用带 get-task-allow=true 的 entitlements 让 Xcode 调试器能 attach
        # Release 用 get-task-allow=false 的版本，否则公证（notarytool）拒收
        Debug:
          CODE_SIGN_ENTITLEMENTS: SSHKeeper/Resources/SSHKeeper.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: SSHKeeper/Resources/SSHKeeper-Release.entitlements

  SSHKeeperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SSHKeeperTests
    dependencies:
      - target: SSHKeeperCore

schemes:
  SSHKeeper:
    build:
      targets:
        SSHKeeper: all
        SSHKeeperTests: [test]
    test:
      targets:
        - SSHKeeperTests
    run:
      config: Debug
    archive:
      config: Release
